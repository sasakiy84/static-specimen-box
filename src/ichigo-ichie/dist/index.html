<!doctype html>
<html lang="ja" dir="ltr">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="一期一会 — NVIDIA Nemotron Personas の背景情報をランダムに表示。"
    />
    <title>一期一会</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1 dir="auto" data-i18n="siteTitle">一期一会</h1>
        <div class="header-tools">
          <label class="interface-language" for="uiLanguage"
            ><select
              id="uiLanguage"
              aria-label="表示言語"
              data-i18n-aria="uiLanguage"
            >
              <option value="ja" lang="ja" dir="auto">日本語</option>
              <option value="en" lang="en" dir="auto">English</option>
              <option value="zh" lang="zh" dir="auto">中文（简体）</option>
              <option value="ko" lang="ko" dir="auto">한국어</option>
              <option value="hi" lang="hi" dir="auto">हिन्दी</option>
              <option value="bn" lang="bn" dir="auto">বাংলা</option>
              <option value="ta" lang="ta" dir="auto">தமிழ்</option>
              <option value="te" lang="te" dir="auto">తెలుగు</option>
              <option value="mr" lang="mr" dir="auto">मराठी</option>
              <option value="gu" lang="gu" dir="auto">ગુજરાતી</option>
              <option value="id" lang="id" dir="auto">Bahasa Indonesia</option>
              <option value="ms" lang="ms" dir="auto">Bahasa Melayu</option>
              <option value="vi" lang="vi" dir="auto">Tiếng Việt</option>
              <option value="th" lang="th" dir="auto">ไทย</option>
              <option value="fil" lang="fil" dir="auto">Filipino</option>
              <option value="es" lang="es" dir="auto">Español</option>
              <option value="fr" lang="fr" dir="auto">Français</option>
              <option value="pt" lang="pt" dir="auto">Português</option>
              <option value="de" lang="de" dir="auto">Deutsch</option>
              <option value="it" lang="it" dir="auto">Italiano</option>
              <option value="nl" lang="nl" dir="auto">Nederlands</option>
              <option value="ru" lang="ru" dir="auto">Русский</option>
              <option value="uk" lang="uk" dir="auto">Українська</option>
              <option value="pl" lang="pl" dir="auto">Polski</option>
              <option value="cs" lang="cs" dir="auto">Čeština</option>
              <option value="sk" lang="sk" dir="auto">Slovenčina</option>
              <option value="ro" lang="ro" dir="auto">Română</option>
              <option value="hu" lang="hu" dir="auto">Magyar</option>
              <option value="bg" lang="bg" dir="auto">Български</option>
              <option value="el" lang="el" dir="auto">Ελληνικά</option>
              <option value="tr" lang="tr" dir="auto">Türkçe</option>
              <option value="sv" lang="sv" dir="auto">Svenska</option>
              <option value="da" lang="da" dir="auto">Dansk</option>
              <option value="no" lang="no" dir="auto">Norsk (bokmål)</option>
              <option value="fi" lang="fi" dir="auto">Suomi</option>
              <option value="ar" lang="ar" dir="auto">العربية</option>
              <option value="he" lang="he" dir="auto">עברית</option>
              <option value="fa" lang="fa" dir="auto">فارسی</option>
              <option value="ur" lang="ur" dir="auto">اردو</option>
              <option value="sw" lang="sw" dir="auto">Kiswahili</option>
            </select></label
          >
          <div class="collection">
            <a
              href="https://huggingface.co/collections/nvidia/nemotron-personas"
              target="_blank"
              rel="noopener noreferrer"
              >NVIDIA · Nemotron Personas ↗</a
            >
          </div>
        </div>
      </header>
      <main class="layout">
        <aside
          class="panel controls"
          aria-label="抽出条件"
          data-i18n-aria="controls"
        >
          <form id="drawForm">
            <fieldset id="controlsFieldset" disabled>
              <div class="selectors single-language" id="selectors">
                <label class="field" for="country"
                  ><span class="label" data-i18n="dataset"
                    >国・データセット</span
                  ><select id="country" name="country">
                    <option value="all">すべての国から</option>
                    <option value="nvidia/Nemotron-Personas-Japan">日本</option>
                    <option value="nvidia/Nemotron-Personas-USA">
                      アメリカ合衆国
                    </option>
                    <option value="nvidia/Nemotron-Personas-India">
                      インド
                    </option>
                    <option value="nvidia/Nemotron-Personas-Singapore">
                      シンガポール
                    </option>
                    <option value="nvidia/Nemotron-Personas-Korea">韓国</option>
                    <option value="nvidia/Nemotron-Personas-Vietnam">
                      ベトナム
                    </option>
                    <option value="nvidia/Nemotron-Personas-Brazil">
                      ブラジル
                    </option>
                    <option value="nvidia/Nemotron-Personas-France">
                      フランス
                    </option>
                    <option value="nvidia/Nemotron-Personas-El-Salvador">
                      エルサルバドル
                    </option>
                    <option value="nvidia/Nemotron-Personas-Belgium">
                      ベルギー
                    </option>
                    <option value="nvidia/Nemotron-Personas-Finance-Japan">
                      Finance Japan
                    </option>
                    <option value="nvidia/Nemotron-Personas-UK">UK</option>
                    <option value="nvidia/Nemotron-Personas-Germany">
                      Germany
                    </option>
                  </select></label
                >
                <label class="field" id="languageField" for="split" hidden=""
                  ><span class="label" data-i18n="dataLanguage"
                    >データの言語</span
                  ><select id="split" name="split" disabled="">
                    <option value="">各国の既定言語</option>
                  </select></label
                >
              </div>
              <details id="filtersDetails">
                <summary>
                  <span><span data-i18n="filters">絞り込み</span></span>
                </summary>
                <label class="field" for="sex"
                  ><span class="label" data-i18n="sex">性別</span
                  ><select id="sex">
                    <option value="" data-i18n="any">指定なし</option>
                    <option value="female" data-i18n="female">女性</option>
                    <option value="male" data-i18n="male">男性</option>
                  </select></label
                >
                <div class="field">
                  <span class="label" id="ageLabel" data-i18n="age">年齢</span>
                  <div class="age-row" role="group" aria-labelledby="ageLabel">
                    <input
                      id="minAge"
                      type="number"
                      min="0"
                      max="130"
                      step="1"
                      placeholder="下限なし"
                      aria-label="年齢の下限"
                      data-i18n-placeholder="minAge"
                      data-i18n-aria="minAgeLabel"
                    />
                    <span aria-hidden="true">–</span>
                    <input
                      id="maxAge"
                      type="number"
                      min="0"
                      max="130"
                      step="1"
                      placeholder="上限なし"
                      aria-label="年齢の上限"
                      data-i18n-placeholder="maxAge"
                      data-i18n-aria="maxAgeLabel"
                    />
                  </div>
                </div>
                <button
                  id="resetFilters"
                  class="reset"
                  type="button"
                  data-i18n="resetFilters"
                >
                  絞り込みをクリア
                </button>
              </details>
              <div class="draw-area">
                <button id="drawButton" class="primary" type="submit">
                  <svg aria-hidden="true" viewBox="0 0 24 24">
                    <path d="M20 7v5h-5M4 17v-5h5"></path>
                    <path
                      d="M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3A7 7 0 0 0 17.9 17"
                    ></path></svg
                  ><span id="drawLabel">ランダムに抽出</span>
                </button>
              </div>
            </fieldset>
          </form>
          <button
            id="cancelButton"
            class="stop"
            type="button"
            data-i18n="cancel"
            hidden=""
          >
            取得を中止
          </button>
          <section class="usage" aria-label="使い方の例" data-i18n-aria="usage">
            <details id="englishPromptDetails">
              <summary id="englishPromptTitle" data-i18n="englishExample">
                英会話練習のプロンプト例
              </summary>
              <textarea
                id="englishPrompt"
                dir="auto"
                class="prompt-text"
                readonly=""
                spellcheck="false"
                aria-labelledby="englishPromptTitle"
              ></textarea>
              <button
                id="copyEnglishPrompt"
                class="small-button"
                type="button"
                data-i18n="promptCopy"
                disabled
              >
                プロンプトをコピー
              </button>
            </details>
            <details id="localPromptDetails" hidden="">
              <summary id="localPromptTitle">英語の練習用プロンプト例</summary>
              <textarea
                id="localPrompt"
                dir="auto"
                class="prompt-text"
                readonly=""
                spellcheck="false"
                aria-labelledby="localPromptTitle"
              ></textarea>
              <button
                id="copyLocalPrompt"
                class="small-button"
                type="button"
                data-i18n="promptCopy"
                disabled=""
              >
                プロンプトをコピー
              </button>
            </details>
          </section>
        </aside>
        <section
          class="panel result"
          id="resultPanel"
          aria-labelledby="personaName"
          aria-busy="false"
        >
          <div class="result-header">
            <div class="persona-heading">
              <h2 id="personaName" class="persona-name" dir="auto">ペルソナ</h2>
            </div>
            <div
              class="formats"
              role="group"
              aria-label="出力形式"
              data-i18n-aria="outputFormat"
            >
              <button
                class="format"
                type="button"
                data-view="background"
                aria-pressed="true"
                data-i18n="backgroundText"
              >
                背景テキスト
              </button>
              <button
                class="format"
                type="button"
                data-view="all"
                aria-pressed="false"
                data-i18n="allFields"
              >
                全項目
              </button>
              <button
                class="format"
                type="button"
                data-view="json"
                aria-pressed="false"
              >
                JSON
              </button>
            </div>
          </div>
          <div class="actions">
            <button id="copyButton" class="action copy" type="button" disabled>
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <rect x="8" y="8" width="12" height="13" rx="2"></rect>
                <path
                  d="M15 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"
                ></path></svg
              ><span data-i18n="copy">コピー</span>
            </button>
            <button id="downloadButton" class="action" type="button" disabled>
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"></path></svg
              ><span data-i18n="save">保存</span>
            </button>
            <button id="copyUrlButton" class="action" type="button" disabled>
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path
                  d="m10 13 4-4m-5 7-2 2a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0m0 10a4 4 0 0 0 6 0l5-5a4 4 0 0 0-6-6l-2 2"
                  transform="translate(1 0) scale(.9)"
                ></path></svg
              ><span data-i18n="replayUrl">再現用URL</span>
            </button>
          </div>
          <div class="output-wrap">
            <textarea
              id="output"
              dir="auto"
              readonly=""
              spellcheck="false"
              aria-label="コピー用の背景情報"
              data-i18n-aria="outputLabel"
              data-format="background"
            ></textarea>
          </div>
          <p
            id="status"
            class="status"
            hidden=""
            role="status"
            aria-live="polite"
            data-kind="info"
          ></p>
        </section>
      </main>
      <noscript data-i18n="noScript"
        >このツールを使うにはJavaScriptを有効にしてください。</noscript
      >
    </div>
    <dialog id="copyDialog" aria-labelledby="copyDialogTitle">
      <h2 id="copyDialogTitle" data-i18n="manualCopy">手動でコピー</h2>
      <textarea
        id="manualCopy"
        dir="auto"
        readonly=""
        aria-label="手動でコピー"
        data-i18n-aria="manualCopy"
      ></textarea>
      <div class="dialog-actions">
        <button
          id="selectManualCopy"
          type="button"
          class="small-button"
          data-i18n="selectAll"
        >
          すべて選択</button
        ><button
          id="closeCopyDialog"
          type="button"
          class="small-button"
          data-i18n="close"
        >
          閉じる
        </button>
      </div>
    </dialog>
    <script type="module" src="./app.js"></script>
  </body>
</html>
